<!DOCTYPE html>
<html>
<head>
  <title>Tournament Bracket</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: sans-serif;
    }

    /* Main one-page container */
    #app {
      height: 100vh;
      display: grid;
      grid-template-rows: 60px 1fr 40px; /* header | content | footer */
    }

    header {
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }

    footer {
      background: #eee;
      text-align: center;
      line-height: 40px;
      font-size: 12px;
    }

    /* Main content area */
    #content {
      display: grid;
      grid-template-columns: 1fr 300px; /* bracket | side panel */
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
      overflow: auto; /* scroll inside box if needed */
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h2>Tournament Bracket</h2>
    </header>

    <div id="content">
      <!-- Bracket area -->
      <div id="bracket" class="box">
        <h3>Bracket</h3>
        <pre id="output"></pre>
      </div>

      <!-- Side info panel -->
      <div id="info" class="box">
        <h3>Info</h3>
        <p>Status, players, round, etc.</p>
      </div>
    </div>

    <footer>
      One-page tournament view
    </footer>
  </div>

  <script>
    fetch('http://localhost:3003/tournaments/YOUR_ID/bracket')
      .then(res => res.json())
      .then(data => {
        document.getElementById('output').textContent =
          JSON.stringify(data, null, 2);
      });
  </script>
</body>
</html>
