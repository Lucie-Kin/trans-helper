services:

  traefik:
    image: docker.io/traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - label=disable
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=transcendance_net"
      # entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # redirection http -> https (global)
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # provider TLS certs
      - "--providers.file.directory=/dynamics"
      - "--providers.file.watch=true"
      # local dashboards + metrics
      - "--api.insecure=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addrouterslabels=true"
      - "--accesslog=true"
      - "--log.level=DEBUG"
    ports:
      - "8082:80" #http
      - "8443:443" #https
      - "8081:8080" #dashboard
    volumes:
      - ${DOCKER_SOCK}:/var/run/docker.sock:ro
      - ./reverse-proxy/certs:/certs:ro,Z
      - ./reverse-proxy/dynamics:/dynamics:ro,Z
      - ./reverse-proxy/auth:/auth:ro,Z
    networks:
      - transcendance_net


  auth:
    container_name: auth
    build:
      context: ./server/services/auth
    expose:
      - "3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`localhost`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.metrics-auth.basicauth.users=prometheus:$$apr1$$qwerty$$mU8gq/R4L.0ZVmZJKzzWb0"
      - "traefik.docker.network=transcendance_net"
    volumes:
      - auth-data:/app/data
    env_file:
      - ./.env
    environment:
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI}
      CHOKIDAR_USEPOLLING: true
    depends_on:
        - logstash
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "auth"
    networks: 
      - transcendance_net


  tournament:
    container_name: tournament
    build:
      context: ./server/services/tournament
    expose:
      - "3003"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tournament.rule=Host(`localhost`) && PathPrefix(`/tournament`)"
      - "traefik.http.routers.tournament.entrypoints=websecure"
      - "traefik.http.routers.tournament.tls=true"
      - "traefik.http.routers.tournament.priority=200"
      - "traefik.http.services.tournament.loadbalancer.server.port=3003"
      - "traefik.docker.network=transcendance_net"
    volumes:
      - tournament_data:/app/data:Z
    env_file:
        - ./.env
    networks:
      - transcendance_net



  chat:
    container_name: chat
    build:
      context: ./server/services/chat
    expose:
      - "3002"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=Host(`localhost`) && PathPrefix(`/chat`)"
      - "traefik.http.routers.chat.entrypoints=websecure"
      - "traefik.http.routers.chat.tls=true"
      - "traefik.http.routers.chat.priority=200"
      - "traefik.http.services.chat.loadbalancer.server.port=3002"
      - "traefik.docker.network=transcendance_net"

      - "traefik.http.routers.chat-metrics.rule=Host(`localhost`) && Path(`/chat/metrics`)"
      - "traefik.http.routers.chat-metrics.entrypoints=websecure"
      - "traefik.http.routers.chat-metrics.tls=true"
      - "traefik.http.routers.chat-metrics.priority=500"
      - "traefik.http.services.chat.loadbalancer.server.port=3002"
    env_file:  
      - ./.env
    depends_on:
        - logstash
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "chat"
    networks:
      - transcendance_net



  webapp:
    container_name: webapp
    build:
      context: ./webapp
    ports:
      - "5173:5000"
    volumes:
      - ./webapp/src:/app/src:Z
      - ./webapp/index.html:/app/index.html:Z
      - ./webapp/vite.config.ts:/app/vite.config.ts:Z
      - ./webapp/tsconfig.json:/app/tsconfig.json:Z
    env_file: 
      - ./.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front.rule=Host(`localhost`) && PathPrefix(`/`)"
      - "traefik.http.routers.front.entrypoints=websecure"
      - "traefik.http.routers.front.tls=true"
      - "traefik.http.routers.front.priority=1"
      - "traefik.http.services.front.loadbalancer.server.port=5000"
    depends_on:
        - logstash
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "webapp"
    command: npm run dev
    networks:
    - transcendance_net


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "0:0"
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=https://localhost:8443/prometheus"
      - "--web.route-prefix=/prometheus"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./monitoring/prometheus/alerting.yml:/etc/prometheus/alerting.yml:ro,Z
      - ./monitoring/data/prometheus:/prometheus:Z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prom.rule=Host(`localhost`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prom.entrypoints=websecure"
      - "traefik.http.routers.prom.tls=true"
      - "traefik.http.routers.prom.priority=200"
      - "traefik.http.services.prom.loadbalancer.server.port=9090"
    networks:
      - transcendance_net


  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    user: "0:0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "https://localhost:8443/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`localhost`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.priority=200"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    volumes:
      - ./monitoring/data/grafana:/var/lib/grafana:Z
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:Z
    env_file:
      - ./.env
    networks:
      - transcendance_net


  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    expose:
      - "9100"
    command:
      - "--web.listen-address=:9100"
    networks: 
      - transcendance_net


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name : elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - transcendance_net
      - elk
    
  es-init:
    image: curlimages/curl:8.5.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ES_URL=http://elasticsearch:9200
    volumes:
      - ./ELK/policies:/policies:ro,Z
    command: ["sh", "/policies/apply-policies.sh"]
    restart: "no"
    networks:
      - elk


  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.18
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      SERVER_BASEPATH: "/kibana"
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: "https://localhost:8443/kibana"
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully

    labels:
      - traefik.enable=true
      - traefik.http.routers.kibana.rule=Host(`localhost`) && PathPrefix(`/kibana`)
      - traefik.http.routers.kibana.entrypoints=websecure
      - traefik.http.routers.kibana.tls=true
      - "traefik.http.routers.kibana.middlewares=kibana-auth"

      # basic auth
      - "traefik.http.middlewares.kibana-auth.basicauth.usersFile=/auth/kibana.htpasswd"
      - "traefik.http.services.kibana.loadbalancer.server.port=5601"
    env_file:
      - ./.env
    networks:
        - transcendance_net


  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.18
    container_name: logstash
    volumes:
      - ./ELK/logstash/logs:/var/log/app:Z
      - ./ELK/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro,Z
    environment:
      ELASTICSEARCH_HOST: "http://elasticsearch:9200"
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: false
    ports:
      - "127.0.0.1:12201:12201/udp"
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
    networks:
      - transcendance_net


  
volumes:
  elastic-data:
  prometheus-data:
  grafana-data:
  auth-data:
    driver: local
  tournament_data:


networks:
  transcendance_net:
    name: transcendance_net
    driver: bridge
  elk:
    driver: bridge
